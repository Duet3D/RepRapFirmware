name: Build and deploy firmware

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (optional)"
        required: false
        type: string
      upload_to_dev_feed:
        description: "Upload binaries to dev pkg feed"
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ARM_TOOLCHAIN: arm-gnu-toolchain-15.2.rel1-x86_64-arm-none-eabi
    steps:
      # Build the branch matching this workflow run (github.ref_name) in each dependency repo,
      # falling back to the repo's tracked branch when that branch doesn't exist there.
      - name: "Resolve branch refs"
        id: refs
        env:
          REF: ${{ github.ref_name }}
        run: |
          resolve() {
            # Exit code 2 means the branch is genuinely absent, anything else is a failed lookup. Falling back
            # on those would build against the wrong sources and upload them under the name of this branch
            status=0
            git ls-remote --exit-code --heads "https://github.com/Duet3D/$1.git" "$REF" >/dev/null 2>&1 || status=$?
            case $status in
              0)
                echo "$1: $REF"
                echo "$1=$REF" >> "$GITHUB_OUTPUT"
                ;;
              2)
                echo "$1: $REF not found, using $2"
                echo "$1=$2" >> "$GITHUB_OUTPUT"
                ;;
              *)
                echo "Could not reach $1 to look up $REF" >&2
                exit 1
                ;;
            esac
          }
          resolve CANlib 3.7-dev
          resolve CoreN2G 3.7-dev
          resolve Duet3Expansion 3.7-dev
          resolve FreeRTOS 3.7-dev
          resolve LibTinyusb 3.7-dev
          resolve LibMbedTls master
          resolve Qfplib-M0-full 3.7-dev
          resolve RRFLibraries 3.7-dev
          resolve WiFiSocketServerRTOS tls_support

      - name: "Check out CANlib"
        uses: actions/checkout@v6
        with:
          repository: "Duet3D/CANlib"
          ref: ${{ steps.refs.outputs.CANlib }}
          path: "./CANlib"

      - name: "Check out CoreN2G"
        uses: actions/checkout@v6
        with:
          repository: "Duet3D/CoreN2G"
          ref: ${{ steps.refs.outputs.CoreN2G }}
          path: "./CoreN2G"

      - name: "Check out FreeRTOS"
        uses: actions/checkout@v6
        with:
          repository: "Duet3D/FreeRTOS"
          ref: ${{ steps.refs.outputs.FreeRTOS }}
          path: "./FreeRTOS"

      - name: "Check out LibTinyusb"
        uses: actions/checkout@v6
        with:
          repository: "Duet3D/LibTinyusb"
          ref: ${{ steps.refs.outputs.LibTinyusb }}
          path: "./LibTinyusb"
          submodules: "recursive"

      - name: "Check out LibMbedTls"
        uses: actions/checkout@v6
        with:
          repository: "Duet3D/LibMbedTls"
          ref: ${{ steps.refs.outputs.LibMbedTls }}
          path: "./LibMbedTls"

      - name: "Check out RepRapFirmware"
        uses: actions/checkout@v6
        with:
          repository: "Duet3D/RepRapFirmware"
          ref: ${{ github.ref_name }}
          path: "./RepRapFirmware"

      - name: "Check out RRFLibraries"
        uses: actions/checkout@v6
        with:
          repository: "Duet3D/RRFLibraries"
          ref: ${{ steps.refs.outputs.RRFLibraries }}
          path: "./RRFLibraries"

      - name: "Check out WiFiSocketServerRTOS"
        uses: actions/checkout@v6
        with:
          repository: "Duet3D/WiFiSocketServerRTOS"
          ref: ${{ steps.refs.outputs.WiFiSocketServerRTOS }}
          path: "./WiFiSocketServerRTOS"

      - name: "Check out Qfplib-M0-full"
        uses: actions/checkout@v6
        with:
          repository: "Duet3D/Qfplib-M0-full"
          ref: ${{ steps.refs.outputs['Qfplib-M0-full'] }}
          path: "./Qfplib-M0-full"

      - name: "Check out Duet3Expansion"
        uses: actions/checkout@v6
        with:
          repository: "Duet3D/Duet3Expansion"
          ref: ${{ steps.refs.outputs.Duet3Expansion }}
          path: "./Duet3Expansion"

      - name: "Prepare CrcAppender"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R Duet3D/CrcAppender --pattern "CrcAppender-linux-x64"
          chmod +x ./CrcAppender-linux-x64
          sudo mv ./CrcAppender-linux-x64 /usr/bin/CrcAppender

      - name: "Adjust versions"
        env:
          VERSION: ${{ inputs.version }}
        run: |
          if [ -n "$(echo "$VERSION" | tr -d '[:space:]')" ]; then
            sed -i "s/# define MAIN_VERSION.\+/# define MAIN_VERSION \"$VERSION\"/g" ./RepRapFirmware/src/Version.h
          else
            echo "No version supplied, leaving Version.h unchanged"
          fi

      - name: "Set up ARM GCC"
        run: |
          curl -L -o "./$ARM_TOOLCHAIN.tar.xz" "https://developer.arm.com/-/media/Files/downloads/gnu/15.2.rel1/binrel/$ARM_TOOLCHAIN.tar.xz"
          tar -xf "./$ARM_TOOLCHAIN.tar.xz"

      - name: "Build firmware"
        working-directory: ./RepRapFirmware
        env:
          CROSS_COMPILE: ${{ github.workspace }}/${{ env.ARM_TOOLCHAIN }}/bin/arm-none-eabi-
        run: |
          make -j"$(nproc)" all

      - name: "Build expansion firmware"
        working-directory: ./Duet3Expansion
        env:
          CROSS_COMPILE: ${{ github.workspace }}/${{ env.ARM_TOOLCHAIN }}/bin/arm-none-eabi-
        run: |
          make -j"$(nproc)" all

      - name: "Arrange files"
        run: |
          mkdir -p upload/maps
          cp ./RepRapFirmware/*/Duet3Firmware_*.bin ./RepRapFirmware/*/Duet3Firmware_*.uf2 ./Duet3Expansion/*/Duet3Firmware_*.bin ./upload/
          rm -f ./upload/Duet3Firmware_Mini5plus.bin
          cp ./RepRapFirmware/*/Duet3Firmware_*.map ./Duet3Expansion/*/Duet3Firmware_*.map ./upload/maps/

      - name: "Attach binaries"
        uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: |
            ./upload/*.bin
            ./upload/*.uf2

      - name: "Attach symbols"
        uses: actions/upload-artifact@v7
        with:
          name: symbols
          path: |
            ./upload/maps/*.map

      - name: "Upload files to testing directory"
        uses: Creepios/sftp-action@v1.0.5
        with:
          host: pkg.duet3d.com
          port: 22
          username: pkg
          privateKey: ${{ secrets.PKG_DEPLOY_KEY }}
          localPath: ./upload
          remotePath: /var/www/reprapfirmware/testing/${{ github.ref_name }}

      - name: "Prepare files for dev feed"
        if: ${{ inputs.upload_to_dev_feed }}
        run: |
          mkdir feed
          cp ./upload/*.bin ./upload/*.uf2 ./feed/

      - name: "Upload files to dev feed"
        if: ${{ inputs.upload_to_dev_feed }}
        uses: Creepios/sftp-action@v1.0.5
        with:
          host: pkg.duet3d.com
          port: 22
          username: pkg
          privateKey: ${{ secrets.PKG_DEPLOY_KEY }}
          localPath: ./feed
          remotePath: /var/rrf-pkg/dev
