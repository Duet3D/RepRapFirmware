name: Build and deploy firmware

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version"
        required: true
        type: string
      upload_to_dev_feed:
        description: "Upload binaries to the dev package feed"
        required: false
        type: boolean
        default: false

jobs:
  build:
    runs-on: ubuntu-24.04
    env:
      ARM_TOOLCHAIN: arm-gnu-toolchain-15.2.rel1-x86_64-arm-none-eabi
    steps:
      - name: "Check out CANlib"
        uses: actions/checkout@v6
        with:
          repository: "Duet3D/CANlib"
          ref: "3.7-dev"
          path: "./CANlib"

      - name: "Check out CoreN2G"
        uses: actions/checkout@v6
        with:
          repository: "Duet3D/CoreN2G"
          ref: "3.7-dev"
          path: "./CoreN2G"

      - name: "Check out FreeRTOS"
        uses: actions/checkout@v6
        with:
          repository: "Duet3D/FreeRTOS"
          ref: "3.7-dev"
          path: "./FreeRTOS"

      - name: "Check out LibTinyusb"
        uses: actions/checkout@v6
        with:
          repository: "Duet3D/LibTinyusb"
          ref: "3.7-dev"
          path: "./LibTinyusb"
          submodules: "recursive"

      - name: "Check out LibMbedTls"
        uses: actions/checkout@v6
        with:
          repository: "Duet3D/LibMbedTls"
          ref: "master"
          path: "./LibMbedTls"

      - name: "Check out RepRapFirmware"
        uses: actions/checkout@v6
        with:
          repository: "Duet3D/RepRapFirmware"
          ref: ${{ github.ref_name }}
          path: "./RepRapFirmware"

      - name: "Check out RRFLibraries"
        uses: actions/checkout@v6
        with:
          repository: "Duet3D/RRFLibraries"
          ref: "3.7-dev"
          path: "./RRFLibraries"

      - name: "Check out WiFiSocketServerRTOS"
        uses: actions/checkout@v6
        with:
          repository: "Duet3D/WiFiSocketServerRTOS"
          ref: "master"
          path: "./WiFiSocketServerRTOS"

      - name: "Prepare CrcAppender"
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download -R Duet3D/CrcAppender --pattern "CrcAppender-linux-x64"
          chmod +x ./CrcAppender-linux-x64
          sudo mv ./CrcAppender-linux-x64 /usr/bin/CrcAppender

      - name: "Adjust versions"
        run: |
          sed -i "s/# define MAIN_VERSION.\+/# define MAIN_VERSION \"${{ inputs.version }}\"/g" ./RepRapFirmware/src/Version.h

      - name: "Set up ARM GCC"
        run: |
          curl -L -o "./$ARM_TOOLCHAIN.tar.xz" "https://developer.arm.com/-/media/Files/downloads/gnu/15.2.rel1/binrel/$ARM_TOOLCHAIN.tar.xz"
          tar -xf "./$ARM_TOOLCHAIN.tar.xz"

      - name: "Build firmware"
        working-directory: ./RepRapFirmware
        env:
          CROSS_COMPILE: ${{ github.workspace }}/${{ env.ARM_TOOLCHAIN }}/bin/arm-none-eabi-
        run: |
          make -j"$(nproc)" Duet3_MB6HC
          make -j"$(nproc)" Duet3_MB6XD
          make -j"$(nproc)" Duet3Mini5plus

      - name: "Arrange files"
        run: |
          mkdir -p upload/maps
          cp ./RepRapFirmware/*/Duet3Firmware_*.bin ./RepRapFirmware/*/Duet3Firmware_*.uf2 ./upload/
          rm -f ./upload/Duet3Firmware_Mini5plus.bin
          cp ./RepRapFirmware/*/Duet3Firmware_*.map ./upload/maps/

      - name: "Attach binaries"
        uses: actions/upload-artifact@v7
        with:
          name: binaries
          path: |
            ./upload/*.bin
            ./upload/*.uf2

      - name: "Attach symbols"
        uses: actions/upload-artifact@v7
        with:
          name: symbols
          path: |
            ./upload/maps/*.map

      - name: "Upload files to testing directory"
        uses: Creepios/sftp-action@v1.0.5
        with:
          host: pkg.duet3d.com
          port: 22
          username: pkg
          privateKey: ${{ secrets.PKG_DEPLOY_KEY }}
          localPath: ./upload
          remotePath: /var/www/reprapfirmware/testing/${{ github.ref_name }}

      - name: "Prepare files for dev feed"
        if: ${{ inputs.upload_to_dev_feed }}
        run: |
          mkdir feed
          cp ./upload/*.bin ./upload/*.uf2 ./feed/

      - name: "Upload files to dev feed"
        if: ${{ inputs.upload_to_dev_feed }}
        uses: Creepios/sftp-action@v1.0.5
        with:
          host: pkg.duet3d.com
          port: 22
          username: pkg
          privateKey: ${{ secrets.PKG_DEPLOY_KEY }}
          localPath: ./feed
          remotePath: /var/rrf-pkg/dev
